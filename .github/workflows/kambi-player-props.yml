name: Update Kambi Player Props

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kambi-player-props:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Kambi player props collector
        run: node scripts/kambi-player-props.js

      - name: Show generated file
        run: |
          echo "===== KAMBI PLAYER PROPS ====="
          head -n 80 data/kambi-player-props-2026.json

      - name: Commit updated Kambi data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kambi-player-props-2026.json

          if git diff --cached --quiet; then
            echo "No Kambi player prop changes to commit."
            exit 0
          fi

          git commit -m "Update Kambi player props data"
          git push
