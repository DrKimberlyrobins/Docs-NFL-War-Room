name: Update NFL Sportsbook Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-sportsbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect CBS sportsbook data
        run: |
          python scripts/update-sportsbook.py

      - name: Commit updated sportsbook data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sportsbook-2026.json

          if git diff --cached --quiet; then
            echo "No sportsbook changes to commit."
          else
            git commit -m "Update NFL sportsbook data"
            git push
          fi
