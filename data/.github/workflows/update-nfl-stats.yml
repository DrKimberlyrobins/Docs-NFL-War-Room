
name: Update NFL Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tools
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Calculate NFL statistics
        run: python scripts/update_nfl_stats.py

      - name: Save updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git diff --cached --quiet || \
            git commit -m "Update NFL statistics"

          git push
